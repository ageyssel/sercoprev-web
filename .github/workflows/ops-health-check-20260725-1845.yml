name: Verify SERCOPREV Production Health

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check production endpoints
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          health_status=$(curl -sS --max-time 30 -H 'Cache-Control: no-cache' -o health.json -w '%{http_code}' "https://www.sercoprev.cl/api/health?_verify=$nonce")
          version_status=$(curl -sS --max-time 30 -H 'Cache-Control: no-cache' -o version.json -w '%{http_code}' "https://www.sercoprev.cl/api/version?_verify=$nonce")
          echo "HEALTH_HTTP=$health_status"
          echo "VERSION_HTTP=$version_status"
          echo 'HEALTH_BODY:'
          cat health.json
          echo
          echo 'VERSION_BODY:'
          cat version.json
          echo

          test "$health_status" = '200'
          test "$version_status" = '200'
          jq -e '.status == "ok"' health.json >/dev/null
          jq -e '.checks.officialDataHistorySchema == true' health.json >/dev/null
          jq -e '.checks | to_entries | all(.value == true)' health.json >/dev/null
          release=$(jq -r '.release // empty' health.json)
          version_release=$(jq -r '.release // empty' version.json)
          test -n "$release"
          test "$release" = "$version_release"
          test "$release" = '2026-07-24-document-ai-tax-folder-1'
