name: Hourly Production Watch 20260725 0755

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check production health and version
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          health_status=$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -o health.json -w '%{http_code}' "https://www.sercoprev.cl/api/health?_watch=$nonce")
          version_status=$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -o version.json -w '%{http_code}' "https://www.sercoprev.cl/api/version?_watch=$nonce")
          echo "HEALTH_HTTP=$health_status"
          echo "VERSION_HTTP=$version_status"
          cat health.json
          echo
          cat version.json
          echo
          test "$health_status" = '200'
          test "$version_status" = '200'
          jq -e '.status == "ok" and .checks.officialDataHistorySchema == true and ([.checks[]] | all)' health.json >/dev/null
          release=$(jq -r '.release // empty' health.json)
          version_release=$(jq -r '.release // empty' version.json)
          test -n "$release"
          test "$release" = "$version_release"
          case "$release" in
            2026-07-23-immutable-payroll-indicators-1|2026-07-24-*) ;;
            *) echo "Unexpected release: $release"; exit 1 ;;
          esac
