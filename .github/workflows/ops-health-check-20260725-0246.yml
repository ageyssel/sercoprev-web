name: SERCOPREV Production Health Check 20260725-0246

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify production endpoints
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          health_status=$(curl -sS --max-time 25 -o health.json -w '%{http_code}' "https://www.sercoprev.cl/api/health?_verify=$nonce")
          version_status=$(curl -sS --max-time 25 -o version.json -w '%{http_code}' "https://www.sercoprev.cl/api/version?_verify=$nonce")
          echo "HEALTH_HTTP=$health_status"
          echo "VERSION_HTTP=$version_status"
          cat health.json
          echo
          cat version.json
          echo
          test "$health_status" = "200"
          test "$version_status" = "200"
          release=$(jq -r '.release // empty' health.json)
          test -n "$release"
          test "$release" = "$(jq -r '.release // empty' version.json)"
          test "$release" = "2026-07-24-document-ai-tax-folder-1"
          jq -e '.status == "ok"' health.json >/dev/null
          checks=(
            publicSupabaseConfig applicationBaseUrl database operationalSchema payrollSchema accountingSchema
            officialIndicatorsSchema officialDataSchema officialDataHistorySchema officialDataFreshness
            closedRecordsProtectionSchema userAccessSchema auditTrailSchema commercialSiteSchema staffMfaSchema
            staffMfaEmailDeliveryConfigured documentIntakeSchema documentAiSchema documentAiTokenConfigured
            administrator documentStorage
          )
          for check in "${checks[@]}"; do
            jq -e --arg check "$check" '.checks[$check] == true' health.json >/dev/null
          done
