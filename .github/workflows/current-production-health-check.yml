name: Current Production Health Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check live production endpoints
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          health_status=$(curl -sS --max-time 30 -o health.json -w '%{http_code}' "https://www.sercoprev.cl/api/health?_verify=$nonce")
          version_status=$(curl -sS --max-time 30 -o version.json -w '%{http_code}' "https://www.sercoprev.cl/api/version?_verify=$nonce")
          echo "HEALTH_HTTP=$health_status"
          echo "VERSION_HTTP=$version_status"
          echo 'HEALTH_BODY='
          cat health.json
          echo
          echo 'VERSION_BODY='
          cat version.json
          echo

          detected_release=$(jq -r '.release // empty' health.json)
          version_release=$(jq -r '.release // empty' version.json)
          failing_checks=$(jq -r '[.checks | to_entries[] | select(.value != true) | .key] | join(",")' health.json 2>/dev/null || true)
          echo "DETECTED_RELEASE=$detected_release"
          echo "VERSION_RELEASE=$version_release"
          echo "FAILING_CHECKS=$failing_checks"

          test "$health_status" = '200'
          test "$version_status" = '200'
          test -n "$detected_release"
          test "$detected_release" = "$version_release"
          jq -e '.status == "ok" and .checks.officialDataHistorySchema == true and ([.checks[]] | all(. == true))' health.json >/dev/null
          jq -e '.service == "sercoprev-web" and .runtime == "cloudflare-workers"' version.json >/dev/null
