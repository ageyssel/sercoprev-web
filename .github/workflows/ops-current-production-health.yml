name: Verify Current Production Health

on:
  push:
    branches: [ops/verify-prod-health-july24]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check live production contract
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          hstatus=$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -o health.json -w '%{http_code}' "https://www.sercoprev.cl/api/health?_verify=$nonce")
          vstatus=$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -o version.json -w '%{http_code}' "https://www.sercoprev.cl/api/version?_verify=$nonce")
          echo "HEALTH_HTTP=$hstatus"
          echo "VERSION_HTTP=$vstatus"
          cat health.json
          echo
          cat version.json
          echo
          test "$hstatus" = '200'
          test "$vstatus" = '200'
          jq -e '.status == "ok"' health.json >/dev/null
          jq -e '.release == "2026-07-24-document-ai-tax-folder-1"' health.json >/dev/null
          jq -e '.service == "sercoprev-web" and .release == "2026-07-24-document-ai-tax-folder-1" and .runtime == "cloudflare-workers"' version.json >/dev/null
          checks=(
            publicSupabaseConfig applicationBaseUrl database operationalSchema payrollSchema accountingSchema
            officialIndicatorsSchema officialDataSchema officialDataHistorySchema officialDataFreshness
            closedRecordsProtectionSchema userAccessSchema auditTrailSchema commercialSiteSchema staffMfaSchema
            staffMfaEmailDeliveryConfigured documentIntakeSchema documentAiSchema documentAiTokenConfigured
            administrator documentStorage
          )
          for check in "${checks[@]}"; do
            jq -e --arg check "$check" '.checks[$check] == true' health.json >/dev/null || {
              echo "FAILING_CHECK=$check"
              exit 1
            }
          done
