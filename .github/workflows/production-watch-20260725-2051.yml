name: Production Watch 20260725 2051

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check production endpoints
        shell: bash
        run: |
          set +e
          expected='2026-07-24-document-ai-tax-folder-1'
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          health_status=$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -o health.json -w '%{http_code}' "https://www.sercoprev.cl/api/health?_verify=$nonce")
          health_curl=$?
          version_status=$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -o version.json -w '%{http_code}' "https://www.sercoprev.cl/api/version?_verify=$nonce")
          version_curl=$?
          detected=$(jq -r '.release // "missing"' version.json 2>/dev/null)
          health_release=$(jq -r '.release // "missing"' health.json 2>/dev/null)
          state=$(jq -r '.status // "missing"' health.json 2>/dev/null)
          failing=$(jq -r '.checks // {} | to_entries | map(select(.value != true) | .key) | join(",")' health.json 2>/dev/null)
          history=$(jq -r '.checks.officialDataHistorySchema // "missing"' health.json 2>/dev/null)
          echo "SUMMARY expected=$expected detected=$detected health_release=$health_release health_http=$health_status version_http=$version_status state=$state officialDataHistorySchema=$history failing=${failing:-none} health_curl=$health_curl version_curl=$version_curl"
          jq -c '{status,release,checks}' health.json 2>/dev/null || true
          jq -c '{service,release,runtime}' version.json 2>/dev/null || true
          ok=true
          [ "$health_curl" = '0' ] || ok=false
          [ "$version_curl" = '0' ] || ok=false
          [ "$health_status" = '200' ] || ok=false
          [ "$version_status" = '200' ] || ok=false
          [ "$detected" = "$expected" ] || ok=false
          [ "$health_release" = "$expected" ] || ok=false
          [ "$state" = 'ok' ] || ok=false
          [ "$history" = 'true' ] || ok=false
          [ -z "$failing" ] || ok=false
          [ "$ok" = true ]
