name: SERCOPREV Production Health Check 20260725-1554

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check health and version
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          health_status=$(curl -sS --max-time 25 -o health.json -w '%{http_code}' "https://www.sercoprev.cl/api/health?_verify=$nonce")
          version_status=$(curl -sS --max-time 25 -o version.json -w '%{http_code}' "https://www.sercoprev.cl/api/version?_verify=$nonce")
          echo "HEALTH_HTTP=$health_status"
          echo "VERSION_HTTP=$version_status"
          cat health.json
          echo
          cat version.json
          echo
          test "$health_status" = '200'
          test "$version_status" = '200'
          jq -e '.status == "ok"' health.json >/dev/null
          jq -e '.release == "2026-07-24-document-ai-tax-folder-1"' health.json >/dev/null
          jq -e '.checks.officialDataHistorySchema == true' health.json >/dev/null
          jq -e '[.checks[]] | all' health.json >/dev/null
          jq -e '.service == "sercoprev-web" and .release == "2026-07-24-document-ai-tax-folder-1" and .runtime == "cloudflare-workers"' version.json >/dev/null
