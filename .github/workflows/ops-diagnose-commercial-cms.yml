name: Diagnose Commercial CMS

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL_SECRET: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DATABASE_URL_SECRET: ${{ secrets.SUPABASE_DATABASE_URL }}
      DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
      POSTGRES_URL_SECRET: ${{ secrets.POSTGRES_URL }}
      SUPABASE_DB_PASSWORD_SECRET: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DATABASE_PASSWORD_SECRET: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
      POSTGRES_PASSWORD_SECRET: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi

      - name: Resolve Supabase database connection
        shell: bash
        run: |
          set -euo pipefail
          raw=''
          for value in "${SUPABASE_DB_URL_SECRET:-}" "${SUPABASE_DATABASE_URL_SECRET:-}" "${DATABASE_URL_SECRET:-}" "${POSTGRES_URL_SECRET:-}"; do
            if [ -n "$value" ]; then raw="$value"; break; fi
          done
          raw=$(RAW="$raw" python - <<'PY'
          import os
          value = os.environ.get('RAW', '').strip()
          if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
              value = value[1:-1].strip()
          print(value, end='')
          PY
          )
          password=''
          for value in "${SUPABASE_DB_PASSWORD_SECRET:-}" "${SUPABASE_DATABASE_PASSWORD_SECRET:-}" "${POSTGRES_PASSWORD_SECRET:-}"; do
            if [ -n "$value" ]; then password="$value"; break; fi
          done
          if [[ "$raw" == postgresql://* || "$raw" == postgres://* ]]; then
            echo "::add-mask::$raw"
            if psql "$raw" -v ON_ERROR_STOP=1 -Atqc 'select 1' >/dev/null 2>&1; then
              echo "SUPABASE_DB_URL=$raw" >> "$GITHUB_ENV"
              exit 0
            fi
            extracted=$(RAW="$raw" python - <<'PY'
          import os
          from urllib.parse import unquote, urlparse
          value = unquote(urlparse(os.environ['RAW']).password or '')
          print('' if value.upper() in {'YOUR-PASSWORD', '[YOUR-PASSWORD]', 'PASSWORD', '[PASSWORD]'} else value, end='')
          PY
            )
            [ -z "$password" ] && password="$extracted"
          elif [ -n "$raw" ] && [ -z "$password" ]; then
            password="$raw"
          fi
          test -n "$password"
          echo "::add-mask::$password"
          encoded=$(PASSWORD="$password" python - <<'PY'
          import os
          from urllib.parse import quote
          print(quote(os.environ['PASSWORD'], safe=''), end='')
          PY
          )
          project_ref='kxrxlygnhukfmdgqhoaz'
          regions=(sa-east-1 us-east-1 us-east-2 us-west-1 us-west-2 ca-central-1 eu-west-1 eu-west-2 eu-central-1 ap-south-1 ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-northeast-2)
          for region in "${regions[@]}"; do
            for cluster in 0 1 2; do
              for port in 5432 6543; do
                candidate="postgresql://postgres.${project_ref}:${encoded}@aws-${cluster}-${region}.pooler.supabase.com:${port}/postgres?sslmode=require&connect_timeout=6"
                echo "::add-mask::$candidate"
                if psql "$candidate" -v ON_ERROR_STOP=1 -Atqc 'select 1' >/dev/null 2>&1; then
                  echo "SUPABASE_DB_URL=$candidate" >> "$GITHUB_ENV"
                  exit 0
                fi
              done
            done
          done
          exit 1

      - name: Verify migration record
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from public.sercoprev_schema_migrations where filename = '202607240018_commercial_site_cms.sql'" | grep -qx '1'

      - name: Verify CMS tables
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from (values (to_regclass('public.pagina_comercial_config')), (to_regclass('public.pagina_comercial_servicios')), (to_regclass('public.pagina_comercial_equipo')), (to_regclass('public.pagina_comercial_resenas'))) t(reg) where reg is not null" | grep -qx '4'

      - name: Verify general configuration
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from public.pagina_comercial_config where id = 'principal' and reviews_enabled = true" | grep -qx '1'

      - name: Verify seeded services
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from public.pagina_comercial_servicios where activo = true" | grep -Eq '^[5-9][0-9]*$'

      - name: Verify seeded team
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from public.pagina_comercial_equipo where activo = true" | grep -Eq '^[7-9][0-9]*$'

      - name: Verify team ordering
        run: |
          value=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select string_agg(nombre, '|' order by orden, nombre) from (select nombre, orden from public.pagina_comercial_equipo where activo = true order by orden, nombre limit 3) q")
          echo "First three team members: $value"
          test "$value" = 'René G. Morales C.|Guillermo Paiguano|José F. Quinchao G.'

      - name: Verify commercial media bucket
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from storage.buckets where id = 'pagina-comercial' and public = true and file_size_limit = 5242880" | grep -qx '1'

      - name: Verify CMS audit triggers
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from pg_trigger where not tgisinternal and tgname in ('audit_change_pagina_comercial_config','audit_change_pagina_comercial_servicios','audit_change_pagina_comercial_equipo','audit_change_pagina_comercial_resenas')" | grep -qx '4'

      - name: Verify public read policies
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from pg_policies where schemaname = 'public' and policyname in ('pagina_comercial_config_public_select','pagina_comercial_servicios_public_select','pagina_comercial_equipo_public_select','pagina_comercial_resenas_public_select')" | grep -qx '4'

      - name: Verify no prices in published services
        run: |
          count=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select count(*) from public.pagina_comercial_servicios where titulo ~ '\$|[0-9]{2,3}[.]?[0-9]{3}' or descripcion ~ '\$|[0-9]{2,3}[.]?[0-9]{3}' or array_to_string(items, ' ') ~ '\$|[0-9]{2,3}[.]?[0-9]{3}'")
          echo "Rows matching price-like values: $count"
          test "$count" = '0'
