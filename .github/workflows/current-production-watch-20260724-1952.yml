name: Current Production Watch 20260724 1952

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify SERCOPREV production endpoints
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          hstatus=$(curl -sS --max-time 25 -o health.json -w '%{http_code}' "https://www.sercoprev.cl/api/health?_verify=$nonce")
          vstatus=$(curl -sS --max-time 25 -o version.json -w '%{http_code}' "https://www.sercoprev.cl/api/version?_verify=$nonce")
          echo "HEALTH_HTTP=$hstatus"
          cat health.json
          echo
          echo "VERSION_HTTP=$vstatus"
          cat version.json
          echo
          test "$hstatus" = "200"
          test "$vstatus" = "200"
          expected='2026-07-24-document-ai-tax-folder-1'
          jq -e --arg release "$expected" '.status == "ok" and .release == $release and (.checks | type == "object") and .checks.officialDataHistorySchema == true and ([.checks[]] | all)' health.json
          jq -e --arg release "$expected" '.service == "sercoprev-web" and .release == $release and .runtime == "cloudflare-workers"' version.json
