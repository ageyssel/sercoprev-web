name: Current Production Health Check 20260726 0354

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check live production endpoints
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s%N)"
          health_status=$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -o health.json -w '%{http_code}' "https://www.sercoprev.cl/api/health?_verify=${nonce}")
          version_status=$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -o version.json -w '%{http_code}' "https://www.sercoprev.cl/api/version?_verify=${nonce}")
          echo "HEALTH_HTTP=${health_status}"
          cat health.json
          echo
          echo "VERSION_HTTP=${version_status}"
          cat version.json
          echo
          release=$(jq -r '.release // ""' version.json)
          health_release=$(jq -r '.release // ""' health.json)
          failures=$(jq -r '[.checks | to_entries[] | select(.value != true) | .key] | join(",")' health.json)
          echo "DETECTED_RELEASE=${release}"
          echo "HEALTH_RELEASE=${health_release}"
          echo "FAILING_CHECKS=${failures}"
          jq -e '.checks.officialDataHistorySchema == true' health.json >/dev/null
          test "$version_status" = '200'
