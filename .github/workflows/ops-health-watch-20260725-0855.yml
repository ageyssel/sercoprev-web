name: SERCOPREV Health Watch 20260725 0855

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check live production with cache busting
        shell: bash
        run: |
          set -euo pipefail
          expected='2026-07-24-document-ai-tax-folder-1'
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          health_status=$(curl -sS --max-time 25 -o health.json -w '%{http_code}' "https://www.sercoprev.cl/api/health?_verify=$nonce")
          version_status=$(curl -sS --max-time 25 -o version.json -w '%{http_code}' "https://www.sercoprev.cl/api/version?_verify=$nonce")
          echo "HEALTH_HTTP=$health_status"
          echo "VERSION_HTTP=$version_status"
          echo 'HEALTH_JSON:'
          cat health.json
          echo
          echo 'VERSION_JSON:'
          cat version.json
          echo
          test "$health_status" = '200'
          test "$version_status" = '200'
          jq -e --arg expected "$expected" '.status == "ok" and .release == $expected and .checks.officialDataHistorySchema == true and ([.checks[]] | all)' health.json >/dev/null
          jq -e --arg expected "$expected" '.service == "sercoprev-web" and .release == $expected and .runtime == "cloudflare-workers"' version.json >/dev/null
