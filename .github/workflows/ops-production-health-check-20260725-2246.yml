name: Production Health Check 2026-07-25 2246

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check production endpoints
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          health_status=$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -o /tmp/health.json -w '%{http_code}' "https://www.sercoprev.cl/api/health?_verify=$nonce")
          version_status=$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -o /tmp/version.json -w '%{http_code}' "https://www.sercoprev.cl/api/version?_verify=$nonce")
          echo "HEALTH_HTTP=$health_status"
          echo "VERSION_HTTP=$version_status"
          echo 'HEALTH_BODY:'
          cat /tmp/health.json
          echo
          echo 'VERSION_BODY:'
          cat /tmp/version.json
          echo
          test "$version_status" = '200'
          jq -e '.service == "sercoprev-web" and (.release | type == "string")' /tmp/version.json >/dev/null
          jq -e '.checks.officialDataHistorySchema == true' /tmp/health.json >/dev/null
